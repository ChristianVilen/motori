name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on main could stop a deploy halfway, and cancellation skips the
  # failure report. deploy.sh skips a commit that is no longer the tip of main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/motori/.env.ci apps/motori/.env
      - run: pnpm build
      - run: cp apps/talli/.env.ci apps/talli/.env
      - run: DEPLOY_APP=talli pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and their system deps, so nothing
    # is downloaded at job time — apt-get against a slow Ubuntu mirror used to eat
    # the whole timeout. Keep the tag in sync with the pinned @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # Normal job time is 1.5-3 min; a wedged runner otherwise hangs forever,
    # never uploads the report artifact, and silently blocks deploy.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motori
          POSTGRES_PASSWORD: motori
          POSTGRES_DB: motori
        options: >-
          --health-cmd "pg_isready -U motori"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/motori/.env.ci apps/motori/.env
      - run: pnpm --filter motori db:migrate
      - run: pnpm --filter motori build
      - run: pnpm --filter motori test:e2e --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: apps/motori/playwright-report/
          retention-days: 7

  e2e-talli:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motori
          POSTGRES_PASSWORD: motori
          POSTGRES_DB: motori
        options: >-
          --health-cmd "pg_isready -U motori"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/motori/.env.ci apps/motori/.env
      - run: cp apps/talli/.env.ci apps/talli/.env
      - run: pnpm --filter motori db:migrate
      - run: pnpm --filter talli db:migrate
      - run: pnpm --filter motori build
      - run: pnpm --filter talli build
      - run: pnpm --filter talli test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-talli-report
          path: apps/talli/playwright-report/
          retention-days: 7

  deploy:
    needs: [lint, format, typecheck, test, e2e, e2e-talli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Backstop for a hang the step timeouts miss; the default is 6 hours.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H motori >> ~/.ssh/known_hosts
      - name: Deploy motori
        timeout-minutes: 20
        run: scripts/deploy.sh motori motori.fi "$GITHUB_SHA"
      - name: Deploy talli
        timeout-minutes: 20
        run: scripts/deploy.sh talli talli.motori.fi "$GITHUB_SHA"
      - name: Report the failed deploy in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="Deploy of $GITHUB_SHA failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The log shows which app and step failed; see DEPLOY.md §5b. Close this issue when a deploy succeeds."
          existing=$(gh issue list --state open --app github-actions --json number,title \
            --jq '[.[] | select(.title == "Deploy failed")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Deploy failed" --assignee "$GITHUB_REPOSITORY_OWNER" --body "$body"
          fi
