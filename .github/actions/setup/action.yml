name: Setup
description: Install pnpm and Node, then install dependencies from the lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: mise.toml
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
